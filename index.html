<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scard Play • Link Bio</title>
    <meta name="description" content="Videomaker Mobile & Estrategista Digital" />
    <style>
      body { 
        background-color: #050505; 
        margin: 0; 
        color: white; 
        font-family: system-ui, -apple-system, sans-serif;
        font-display: swap;
      }
      #root { min-height: 100vh; }
      .skeleton-container {
        max-width: 512px;
        margin: 0 auto;
        padding: 80px 24px 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .skeleton-avatar {
        width: 112px;
        height: 112px;
        border-radius: 50%;
        background: linear-gradient(45deg, #dc2626, #ef4444, #000);
        margin-bottom: 40px;
        border: 4px solid #050505;
        box-shadow: 0 0 50px -12px rgba(220,38,38,0.5);
        position: relative;
      }
      .skeleton-avatar::after {
        content: '';
        position: absolute;
        bottom: 4px;
        right: 4px;
        width: 28px;
        height: 28px;
        background: #22c55e;
        border: 4px solid #050505;
        border-radius: 50%;
      }
      .skeleton-name {
        font-size: 36px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: -0.05em;
        margin-bottom: 24px;
        background: linear-gradient(to bottom, #fff, #a1a1aa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .skeleton-badge {
        background: rgba(220, 38, 38, 0.1);
        border: 1px solid rgba(220, 38, 38, 0.2);
        padding: 6px 16px;
        border-radius: 99px;
        font-size: 9px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: #ef4444;
        margin-bottom: 24px;
      }
      .skeleton-button {
        width: 100%;
        height: 64px;
        background: #18181b;
        border-radius: 12px;
        margin-bottom: 12px;
        border: 2px solid transparent;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="skeleton-container">
        <div class="skeleton-avatar"></div>
        <div class="skeleton-name">DIEGO SCARD</div>
        <div class="skeleton-badge">CRIADOR DE CONTEÚDO DIGITAL</div>
        <div class="skeleton-button"></div>
        <div class="skeleton-button"></div>
        <div class="skeleton-button"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
